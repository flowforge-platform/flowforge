services:
  discovery-service:
    image: aswinrj/discovery-service
    container_name: discovery-service
    restart: always
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  api-gateway:
    image: aswinrj/api-gateway
    container_name: api-gateway
    restart: always
    depends_on:
      - discovery-service
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  auth-service:
    image: aswinrj/auth-service
    container_name: auth-service
    restart: always
    depends_on:
      - db
      - mailpit
      - discovery-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://flowforge-postgres:5432/flowforge
      DB_USER: postgres
      DB_PASSWORD: postgres

      FLYWAY_LOCATIONS: filesystem:/app/database/migrations/auth

      MAIL_HOST: flowforge-mailpit
      MAIL_PORT: 1025

      EUREKA_URL: http://discovery-service:8761/eureka/

      JAEGER_ENDPOINT: http://jaeger:4318/v1/traces

      JWT_SECRET: dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWZsb3dmb3JnZS1hdXRoLXNlcnZpY2U=
    volumes:
      - ./database/migrations:/app/database/migrations

  workflow-service:
    image: anzyl/workflow-service:latest
    container_name: workflow-service
    ports:
      - "8082:8082"
    depends_on:
      - discovery-service
    networks:
      - default
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/flowforge
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-service:8761/eureka/
      JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_KAFKA_PRODUCER_PROPERTIES_SPRING_JSON_ADD_TYPE_HEADERS: "true"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: "true"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TYPE_MAPPING: "com.flowforge.worker_service.adapter.out.kafka.TaskSucceededEvent:com.flowforge.workflowservice.application.execution.event.TaskSucceededEvent,com.flowforge.worker_service.adapter.out.kafka.TaskFailedEvent:com.flowforge.workflowservice.application.execution.event.TaskFailedEvent"
    volumes:
      - ./database:/app/database
      - ./workflow-service/target/workflow-service-0.0z.1-SNAPSHOT.jar:/app/app.jar

  worker-service:
    image: aswinrj/worker-service
    container_name: worker-service
    restart: always
    depends_on:
      - discovery-service
      - kafka
      - db
      - mailpit
    ports:
      - "8083:8083"
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./database/migrations:/app/database/migrations
      - ./worker-service/target/worker-service-0.0.1-SNAPSHOT.jar:/app/app.jar