services:
  discovery-service:
    image: aswinrj/discovery-service
    container_name: discovery-service
    restart: always
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  api-gateway:
    image: aswinrj/api-gateway
    container_name: api-gateway
    restart: always
    depends_on:
      - discovery-service
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  auth-service:
    image: aswinrj/auth-service
    container_name: auth-service
    restart: always
    depends_on:
      - db
      - mailpit
      - discovery-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./database/migrations:/app/database/migrations

  workflow-service:
    image: anzyl/workflow-service:latest
    container_name: workflow-service
    ports:
      - "8082:8082"
    depends_on:
      - discovery-service
    networks:
      - default
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/flowforge
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./database:/app/database

  worker-service:
    image: aswinrj/worker-service
    container_name: worker-service
    restart: always
    depends_on:
      - discovery-service
      - kafka
      - db
      - mailpit
    ports:
      - "8083:8083"
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./database/migrations:/app/database/migrations