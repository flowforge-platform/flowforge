apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    app: kibana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kibana

  template:
    metadata:
      labels:
        app: kibana

    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.18.1

          ports:
            - containerPort: 5601
              name: http

          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"