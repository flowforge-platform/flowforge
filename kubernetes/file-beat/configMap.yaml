apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  labels:
    app: filebeat

spec:
  selector:
    matchLabels:
      app: filebeat

  template:
    metadata:
      labels:
        app: filebeat

    spec:
      serviceAccountName: filebeat

      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.18.1

          args:
            - "-c"
            - "/usr/share/filebeat/filebeat.yml"
            - "-e"

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          volumeMounts:
            - name: config
              mountPath: /usr/share/filebeat/filebeat.yml
              subPath: filebeat.yml
              readOnly: true

            - name: varlog
              mountPath: /var/log

            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"

            limits:
              cpu: "300m"
              memory: "400Mi"

      volumes:
        - name: config
          configMap:
            name: filebeat-config

        - name: varlog
          hostPath:
            path: /var/log

        - name: containers
          hostPath:
            path: /var/lib/docker/containers