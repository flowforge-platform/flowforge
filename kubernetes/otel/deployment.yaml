apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector

spec:
  replicas: 1

  selector:
    matchLabels:
      app: otel-collector

  template:
    metadata:
      labels:
        app: otel-collector

    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:latest

          args:
            - "--config=/etc/otel/otel-collector-config.yaml"

          ports:
            - containerPort: 4317
              name: grpc

            - containerPort: 4318
              name: http

          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel

      volumes:
        - name: otel-config
          configMap:
            name: otel-config