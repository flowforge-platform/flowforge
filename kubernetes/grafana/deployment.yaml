apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      securityContext:
        fsGroup: 472

      containers:
        - name: grafana
          image: grafana/grafana:latest

          securityContext:
            runAsUser: 472
            runAsGroup: 472

          ports:
            - containerPort: 3000
              name: http

          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc