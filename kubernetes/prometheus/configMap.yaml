apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "discovery-service"
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets:
              - discovery-service:8761

      - job_name: "api-gateway"
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets:
              - api-gateway:8888

      - job_name: "auth-service"
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets:
              - auth-service:8081

      - job_name: "workflow-service"
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets:
              - workflow-service:8082

      - job_name: "worker-service"
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets:
              - worker-service:8083