apiVersion: apps/v1
kind: Deployment

metadata:
  name: workflow-service
  labels:
    app: workflow-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: workflow-service

  template:
    metadata:
      labels:
        app: workflow-service
    spec:
      containers:
        - name: workflow-service
          image: anzyl/workflow-service:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/flowforge

            - name: DB_USERNAME
              value: postgres

            - name: DB_PASSWORD
              value: postgres



