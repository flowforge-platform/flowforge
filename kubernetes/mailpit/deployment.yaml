apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app: mailpit

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mailpit

  template:
    metadata:
      labels:
        app: mailpit

    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest

          ports:
            - containerPort: 1025
              name: smtp

            - containerPort: 8025
              name: web

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"