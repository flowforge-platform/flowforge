server:
  port: 8761

spring:
  application:
    name: discovery-service
  profile:
    default: dev
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    wait-time-in-ms-when-sync-empty: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted

  metrics:
    enable:
      all: true

  tracing:
    enabled: true
    sampling:
      probability: 1.0