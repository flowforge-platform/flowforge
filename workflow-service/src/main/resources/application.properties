server.port=8082

spring.application.name=workflow-service

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=workflow

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.flyway.schemas=workflow
spring.flyway.default-schema=workflow
spring.flyway.create-schemas=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Enable Prometheus endpoint
management.endpoint.prometheus.access=unrestricted

# Enable health details
management.endpoint.health.show-details=always

# Enable metrics
management.metrics.enable.all=true

# Enable tracing
management.tracing.enabled=true

# Sample every request (development)
management.tracing.sampling.probability=1.0



# Default profile
spring.profiles.default=dev

# Kafka
# Producer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.flowforge.workflowservice.application.execution.event.TaskFailedEvent

# Listener
spring.kafka.listener.ack-mode=record

# Register this service with Eureka
eureka.client.register-with-eureka=true

# Fetch registry from Eureka
eureka.client.fetch-registry=true

# Register using IP address instead of hostname
eureka.instance.prefer-ip-address=true

# Custom instance ID
eureka.instance.instance-id=${spring.application.name}:${server.port}
