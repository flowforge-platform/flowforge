server.port=8082

spring.application.name=workflow-service

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=filesystem:/app/database/migrations

# Actuator
management.endpoints.web.exposure.include=health,info

# Default profile
spring.profiles.default=dev

# Kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Register this service with Eureka
eureka.client.register-with-eureka=true

# Fetch registry from Eureka
eureka.client.fetch-registry=true

# Register using IP address instead of hostname
eureka.instance.prefer-ip-address=true

# Custom instance ID
eureka.instance.instance-id=${spring.application.name}:${server.port}
