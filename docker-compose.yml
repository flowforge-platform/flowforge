version: '3.8'

services:
  discovery-service:
    image: aswinrj/discovery-service
    container_name: discovery-service
    restart: always
    ports:
      - "8761:8761"

  api-gateway:
    image: aswinrj/api-gateway
    container_name: api-gateway
    restart: always
    depends_on:
      - discovery-service
    ports:
      - "8888:8081"

  auth-service:
    image: aswinrj/auth-service
    container_name: auth-service
    restart: always
    depends_on:
      - db
      - mailpit
      - discovery-service
    ports:
      - "8083:8082"

  db:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    restart: always
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: flowforge-mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  workflow-service:
    image: anzyl/workflow-service:v1
    container_name: workflow-service
    ports:
      - "8082:8082"
    depends_on:
      - db
      - discovery-service
    networks:
      - default
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./database:/app/database

  kafka:
    image: apache/kafka:latest
    container_name: flowforge-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
  kafka_data: