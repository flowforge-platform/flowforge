version: '3.8'

services:
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    depends_on:
      - db
      - mailpit
    ports:
      - "8081:8081"

  db:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    restart: always
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: flowforge-mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  workflow-service:
    image: anzyl/workflow-service:v1
    container_name: workflow-service
    ports:
      - "8082:8082"
    depends_on:
      - db
    networks:
      - default

volumes:
  postgres_data: